    <script>
      (function() {
        // 1. Intercept unhandled promise rejections and global errors related to Vite HMR WebSockets
        window.addEventListener('unhandledrejection', function(e) {
          if (!e) return;
          var reason = e.reason;
          var msg = '';
          if (typeof reason === 'string') msg = reason;
          else if (reason && reason.message) msg = reason.message;
          else if (reason && reason.toString) msg = reason.toString();

          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            msg.indexOf('ws:') !== -1 ||
            msg.indexOf('wss:') !== -1 ||
            msg.indexOf('closed without opened') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(e) {
          if (!e) return;
          var msg = e.message || (e.error && e.error.message) || '';
          if (
            msg.indexOf('WebSocket') !== -1 ||
            msg.indexOf('vite') !== -1 ||
            msg.indexOf('ws:') !== -1 ||
            msg.indexOf('wss:') !== -1 ||
            msg.indexOf('closed without opened') !== -1
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        // 2. Wrap WebSocket constructor so Vite client's HMR socket fails gracefully without throwing
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            if (typeof url === 'string' && (url.includes('vite') || url.includes('hmr') || url.includes(':3000'))) {
              var fakeSocket = {
                readyState: 3, // CLOSED
                bufferedAmount: 0,
                extensions: '',
                protocol: '',
                url: url,
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              setTimeout(function() {
                if (typeof fakeSocket.onclose === 'function') {
                  try {
                    fakeSocket.onclose(new CloseEvent('close', { wasClean: true, code: 1000, reason: 'HMR Disabled in Sandbox' }));
                  } catch (err) {}
                }
              }, 10);
              return fakeSocket;
            }
            return new (Function.prototype.bind.apply(NativeWebSocket, [null].concat(Array.prototype.slice.call(arguments))))();
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
